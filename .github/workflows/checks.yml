name: Read-only validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.8.0
      - run: npm ci --ignore-scripts
      - run: npm run build:query
      - run: npm test
      - run: node node_modules/vitest/vitest.mjs run tests/components
      - run: npm run typecheck
      - run: npm run build -w muniment-web
      - run: npm run build -w muniment-insights
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.audit.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-browser-results
          path: |
            .release/audit-regressions.json
            test-results/
